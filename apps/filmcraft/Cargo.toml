[package]
name = "filmcraft"
description = "JBD, AI video editor by Jabrod (desktop app)"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "jbd"
build = "build.rs"

# The package keeps its upstream name (filmcraft) so merges from FilmCraft stay easy; the program
# it builds is jbd.exe.
[[bin]]
name = "jbd"
path = "src/main.rs"

[lints]
workspace = true

[features]
# JBD ships with speech to text on (Text panel ▸ Transcribe; models download on first use).
default = ["whisper"]
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["filmcraft-engine/whisper", "filmcraft-engine/speech-download"]

[dependencies]
jbd-account = { workspace = true }
# CPU load for the title-bar meter
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
filmcraft-engine = { workspace = true }
filmcraft-ui-egui = { workspace = true }
filmcraft-platform = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
cpal = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2 = "0.6"
# Same winit as eframe: macOS event-loop options (no app activation when driven by an agent).
winit = { version = "0.30", default-features = false }

# Icon + VERSIONINFO for jbd.exe (build.rs); only needed when building on Windows.
# The window handle, to give the window the big taskbar icon (filmcraft_platform::win_icon).
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
