[package]
name = "jbd-art"
description = "Art Studio: the client for Jabrod Art's API (boards, library, models, chat, image/voice/video generation, Art Pro)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
jbd-account = { workspace = true }

# The network exists only in the desktop app; the web build compiles the types so ui-egui can
# still build for wasm (there the studio itself runs at art.jabrod.com/studio).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
