[package]
name = "jbd-director"
description = "JBD: the AI Director — an agent that edits your timeline and generates video, through the engine's commands"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
jbd-account = { workspace = true }
filmcraft-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# contact sheets for the look tool (frames the model can see)
image = { version = "0.25", default-features = false, features = ["png"] }

# The network lives in the desktop app only; the web build compiles the types so ui-egui can
# still build for wasm (same split as jbd-account).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
base64 = "0.22"
